name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Use the Go version installed by setup-go without switching toolchains.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: htdocs-deps/package-lock.json
      - run: make fmt-check vet test build
      - name: Check independent example plugin module
        working-directory: bin/echo-plugin
        run: |
          go vet ./...
          go test ./...
      - run: npm ci --prefix htdocs-deps
      - run: make frontend frontend-test licenses-check docs-check smoke
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix htdocs-deps
      - run: npm audit --prefix htdocs-deps --audit-level=moderate
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
      - working-directory: bin/echo-plugin
        run: govulncheck ./...
