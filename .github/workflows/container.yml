name: CI / Container and Deployment
on:
  pull_request:
    paths: ['Dockerfile', '.dockerignore', 'deploy/**', '**/*.go', 'go.mod', 'go.sum', 'htdocs/**', 'htdocs-deps/**', 'tests/**', '.github/workflows/container.yml']
  push:
    branches: [main]
    paths: ['Dockerfile', '.dockerignore', 'deploy/**', '**/*.go', 'go.mod', 'go.sum', 'htdocs/**', 'htdocs-deps/**', 'tests/**', '.github/workflows/container.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check single-node deployment invariants
        run: python3 -m unittest discover -s tests -p 'test_container_config.py'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build local image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: owlcron:ci
          cache-from: type=gha,scope=owlcron-container
          cache-to: type=gha,scope=owlcron-container,mode=max
      - name: Verify read-only non-root startup and persistent state
        shell: bash
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          docker volume create owlcron-ci-state
          trap 'docker rm -f owlcron-ci >/dev/null 2>&1 || true; docker volume rm owlcron-ci-state >/dev/null 2>&1 || true' EXIT
          docker run --rm -e OWLCRON_SECRET_KEY="$secret" -v owlcron-ci-state:/var/lib/owlcron owlcron:ci setup
          docker run -d --name owlcron-ci --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges -e OWLCRON_SECRET_KEY="$secret" -v owlcron-ci-state:/var/lib/owlcron -p 127.0.0.1:3012:3012 owlcron:ci
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3012/api/app/ping >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3012/api/app/ping | python3 -c 'import json,sys; assert json.load(sys.stdin)["code"] == 0'
          python3 tests/check_frontend_assets.py http://127.0.0.1:3012
          test "$(docker exec owlcron-ci id -u)" = 10001
          docker exec -i owlcron-ci /bin/sh -s -- /opt/owlcron/owlcron-script < tests/smoke_script_adapter.sh
          docker restart -t 90 owlcron-ci
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3012/api/app/ping >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3012/api/app/ping | python3 -c 'import json,sys; assert json.load(sys.stdin)["code"] == 0'
