name: Linux process identity regression
on:
  push:
    branches: [main]
    paths: ['engine/process_identity*', 'websocket/**', '.github/workflows/process-identity.yml']
  pull_request:
    paths: ['engine/process_identity*', 'websocket/**', '.github/workflows/process-identity.yml']
  workflow_dispatch:
# Push and PR events for one branch share a group; newer runs replace old ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  process-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - name: Repeat recovery identity and exit races
        run: go test -race ./engine -run '^Test(LinuxProcessReadError|Recovery(ProcessIdentityAndTokenBoundary|ProcessIdentityRejectsInvalidPID|TokenDuringProcessExit))$' -count=30 -timeout=180s
      - name: Repeat WebSocket registration race
        run: go test -race ./websocket -run '^TestClosingOneClientPreservesConcurrentConnections$' -count=100 -timeout=120s
