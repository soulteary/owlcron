name: Release / Build and Package
on:
  pull_request:
    paths: ['htdocs-deps/**', 'tools/bun-lock.mjs', 'tests/check_licenses.py', 'tools/package_release.py', 'tools/verify_release.py', 'tools/release/**', 'docs/release-notes.md', 'docs/zh-CN/release-notes.md', 'tests/test_release_package.py', 'tests/release_acceptance.py', 'tests/release_deployment.py', 'tests/check_frontend_assets.py', 'migration/testdata/**', '**/*.go', 'config.json', 'htdocs/**', 'go.mod', 'go.sum', 'Makefile', '.github/workflows/release.yml']
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Archive version to validate; manual runs never create tags or releases'
        required: false
        default: 'v0.0.0-dev'
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v0.0.0-dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('htdocs-deps/bun.lock', 'tests/browser/bun.lock') }}
      - run: bun install --cwd htdocs-deps --frozen-lockfile
      - run: make licenses-check docs-check
      - run: go test ./cli -count=1
      - run: python3 -m unittest discover -s tests -p 'test_release_package.py'
      - name: Build native Linux archive
        run: make release VERSION="$VERSION"
      - name: Prepare deployment acceptance
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx openssl
          go build -trimpath -o dist/owlcron-migrate-check ./cmd/owlcron-migrate-check
      - name: Verify archive, HTTPS deployment and synthetic migration
        run: python3 tools/verify_release.py dist/*.tar.gz --deployment-checker dist/owlcron-migrate-check
      - name: Verify archive in a clean runtime container
        run: |
          docker run --rm --network none --read-only \
            --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,exec,nosuid,nodev,mode=1777,size=512m \
            --env PYTHONDONTWRITEBYTECODE=1 --workdir /check \
            --mount "type=bind,src=$PWD/dist,dst=/dist,readonly" \
            --mount "type=bind,src=$PWD/tools/verify_release.py,dst=/check/tools/verify_release.py,readonly" \
            --mount "type=bind,src=$PWD/tools/package_release.py,dst=/check/tools/package_release.py,readonly" \
            --mount "type=bind,src=$PWD/tests/release_acceptance.py,dst=/check/tests/release_acceptance.py,readonly" \
            --mount "type=bind,src=$PWD/tests/check_frontend_assets.py,dst=/check/tests/check_frontend_assets.py,readonly" \
            python:3.13.17-slim-trixie /bin/sh -eu -c '
              for tool in go bun node npm; do
                if command -v "$tool" >/dev/null 2>&1; then
                  echo "Unexpected build dependency in runtime: $tool" >&2
                  exit 1
                fi
              done
              set -- /dist/*.tar.gz
              test "$#" -eq 1 && test -f "$1"
              exec python3 -B /check/tools/verify_release.py "$1"
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-amd64-release
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
  draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-amd64-release
          path: dist
      - name: Create draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" dist/*.tar.gz dist/*.sha256 --verify-tag --draft --title "$VERSION" --generate-notes
