name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Push and PR events for one branch share a group; newer runs replace old ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Use the Go version installed by setup-go without switching toolchains.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('htdocs-deps/bun.lock', 'tests/browser/bun.lock') }}
      - name: Validate workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Formatting and static checks
        run: make fmt-check vet
      - name: Fast unit tests
        run: go test -short ./... -count=1 -timeout=120s
      - name: Build production executables
        run: make build
      - name: Check independent example plugin module
        working-directory: bin/echo-plugin
        run: |
          go vet ./...
          go test ./...
      - run: bun install --cwd htdocs-deps --frozen-lockfile
      - run: make frontend frontend-test licenses-check docs-check smoke
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('htdocs-deps/bun.lock', 'tests/browser/bun.lock') }}
      - run: bun install --cwd htdocs-deps --frozen-lockfile
      - run: bun audit --cwd htdocs-deps --audit-level=moderate
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
      - working-directory: bin/echo-plugin
        run: govulncheck ./...
