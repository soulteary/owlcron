name: Browser smoke
on:
  pull_request:
    paths: ['htdocs/**', 'htdocs-deps/**', '**/*.go', 'go.mod', 'go.sum', 'Makefile', 'tools/bun-lock.mjs', 'tests/browser/**', 'licenses/browser/**', 'licenses/browser-inventory.json', '.github/workflows/browser.yml']
  push:
    branches: [main]
    paths: ['htdocs/**', 'htdocs-deps/**', '**/*.go', 'go.mod', 'go.sum', 'Makefile', 'tools/bun-lock.mjs', 'tests/browser/**', 'licenses/browser/**', 'licenses/browser-inventory.json', '.github/workflows/browser.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('htdocs-deps/bun.lock', 'tests/browser/bun.lock') }}
      - run: bun install --cwd htdocs-deps --frozen-lockfile
      - run: bun install --cwd tests/browser --frozen-lockfile
      - run: bun run --cwd tests/browser licenses
      - run: bun audit --cwd tests/browser --audit-level=moderate
      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-${{ hashFiles('tests/browser/bun.lock') }}
      - name: Install Chromium and its system dependencies
        working-directory: tests/browser
        run: bunx --bun --no-install playwright install --with-deps --only-shell chromium
      - run: make build frontend
      - run: bun run --cwd tests/browser test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: chromium-smoke-failure
          path: tests/browser/test-results/
          if-no-files-found: ignore
          retention-days: 7
