name: CI / Browser Tests
on:
  pull_request:
    paths: ['htdocs/**', 'htdocs-deps/**', '**/*.go', 'go.mod', 'go.sum', 'Makefile', 'tools/bun-lock.mjs', 'tests/browser/**', 'licenses/browser/**', 'licenses/browser-inventory.json', '.github/workflows/browser.yml']
  push:
    branches: [main]
    paths: ['htdocs/**', 'htdocs-deps/**', '**/*.go', 'go.mod', 'go.sum', 'Makefile', 'tools/bun-lock.mjs', 'tests/browser/**', 'licenses/browser/**', 'licenses/browser-inventory.json', '.github/workflows/browser.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('htdocs-deps/bun.lock', 'tests/browser/bun.lock') }}
      - run: bun install --cwd htdocs-deps --frozen-lockfile
      - run: bun install --cwd tests/browser --frozen-lockfile
      - run: bun run --cwd tests/browser licenses
      - run: bun audit --cwd tests/browser --audit-level=moderate
      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-${{ hashFiles('tests/browser/bun.lock') }}
      - name: Install Chromium and its system dependencies
        working-directory: tests/browser
        run: bunx --bun --no-install playwright install --with-deps --only-shell chromium
      - run: make build frontend
      - run: bun run --cwd tests/browser test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: chromium-smoke-failure
          path: tests/browser/test-results/
          if-no-files-found: ignore
          retention-days: 7
