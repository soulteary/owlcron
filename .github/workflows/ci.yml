name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Push and PR events for one branch share a group; newer runs replace old ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Use the Go version installed by setup-go without switching toolchains.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: htdocs-deps/package-lock.json
      - name: Validate workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Formatting and static checks
        run: make fmt-check vet
      - name: Fast unit tests
        run: go test -short ./... -count=1 -timeout=120s
      - name: Build production executables
        run: make build
      - name: Check independent example plugin module
        working-directory: bin/echo-plugin
        run: |
          go vet ./...
          go test ./...
      - run: npm ci --prefix htdocs-deps
      - run: make frontend frontend-test licenses-check docs-check smoke
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: htdocs-deps/package-lock.json
      - run: npm ci --prefix htdocs-deps
      - run: npm audit --prefix htdocs-deps --audit-level=moderate
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
      - working-directory: bin/echo-plugin
        run: govulncheck ./...
